<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neville Goddard Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Open markdown corpus of Neville Goddard books and lectures — a free public wiki." />
  <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1814" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    /* Kindle-like reading shell */
    :root {
      --theme-color: #8a6a1f;
      --paper: #f4efe6;
      --ink: #2a241c;
      --muted: #6e6458;
      --chrome: #ebe4d8;
      --serif: "Palatino Linotype", Palatino, "Book Antiqua", "Iowan Old Style", "New York", Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --reader-max: 38rem;
      --reader-pad: clamp(1rem, 4.5vw, 1.75rem);
      --line: 1.65;
      --body-size: clamp(1.125rem, 2.8vw + 0.85rem, 1.28rem);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --theme-color: #d4b45a;
        --paper: #1a1814;
        --ink: #e8e0d2;
        --muted: #a89b88;
        --chrome: #242018;
      }
      .sidebar { background: #141210 !important; border-right-color: #2e2922 !important; }
      .sidebar ul li a { color: #d8cfc0 !important; }
      .sidebar ul li.active > a { color: var(--theme-color) !important; }
      .search input {
        background: #242018 !important;
        color: var(--ink) !important;
        border-color: #3a342c !important;
      }
      .markdown-section code,
      .markdown-section pre {
        background: #242018 !important;
      }
      .markdown-section tr:nth-child(2n) { background: #221e18 !important; }
    }

    html, body {
      background: var(--paper) !important;
      color: var(--ink) !important;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overscroll-behavior-y: contain;
    }

    body {
      font-family: var(--serif);
      font-size: var(--body-size);
      line-height: var(--line);
      letter-spacing: 0.01em;
      /* Kindle-ish soft rendering */
      -webkit-font-smoothing: antialiased;
    }

    /* Content column like a Kindle page */
    .content {
      padding-top: 0 !important;
      left: 0 !important;
    }
    .markdown-section {
      max-width: var(--reader-max) !important;
      padding: calc(1.25rem + env(safe-area-inset-top)) var(--reader-pad) calc(3.5rem + env(safe-area-inset-bottom)) !important;
      margin: 0 auto !important;
      color: var(--ink) !important;
    }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      font-family: var(--serif);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0.02em;
      color: var(--ink) !important;
      margin-top: 1.6em;
    }
    .markdown-section h1 { font-size: 1.55em; }
    .markdown-section h2 { font-size: 1.28em; border-bottom: none !important; }
    .markdown-section p,
    .markdown-section li {
      font-size: 1em;
      line-height: var(--line);
      orphans: 3;
      widows: 3;
    }
    .markdown-section p { margin: 0.85em 0; }
    .markdown-section a { color: var(--theme-color) !important; text-decoration: underline; text-underline-offset: 0.15em; }
    .markdown-section blockquote {
      border-left: 3px solid var(--theme-color) !important;
      color: var(--muted) !important;
      background: transparent !important;
      font-style: italic;
      padding: 0.2em 0 0.2em 1em !important;
    }
    .markdown-section table {
      display: block;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      font-size: 0.92em;
    }
    .markdown-section code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.88em;
    }

    /* Chrome / sidebar — phone first */
    .sidebar {
      background: var(--chrome) !important;
      padding-top: env(safe-area-inset-top);
      font-family: var(--sans);
      font-size: 0.92rem;
    }
    .sidebar .app-name {
      font-family: var(--serif);
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 1rem 1rem 0.35rem;
    }
    .sidebar .app-name-link { color: var(--ink) !important; }
    .sidebar-toggle {
      background: color-mix(in srgb, var(--paper) 88%, transparent) !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      width: 44px !important;
      height: 44px !important;
      bottom: calc(1rem + env(safe-area-inset-bottom)) !important;
      left: calc(0.75rem + env(safe-area-inset-left)) !important;
      border-radius: 999px !important;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      display: flex !important;
      align-items: center;
      justify-content: center;
    }
    .sidebar-toggle span { background-color: var(--ink) !important; }

    .search {
      margin: 0 0.75rem 0.75rem !important;
      padding: 0 !important;
      border: none !important;
    }
    .search input {
      font-family: var(--sans) !important;
      font-size: 16px !important; /* prevent iOS zoom */
      border-radius: 10px !important;
      padding: 0.7rem 0.85rem !important;
      background: var(--paper) !important;
      border: 1px solid color-mix(in srgb, var(--muted) 35%, transparent) !important;
    }

    /* Hide GitHub corner / noisy bits on small screens */
    @media (max-width: 768px) {
      .github-corner { display: none !important; }
      main { padding-left: 0 !important; }
      .content { left: 0 !important; }
      /* Slightly larger tap targets in nav */
      .sidebar ul li a {
        padding: 0.45rem 0 !important;
        line-height: 1.35 !important;
      }
      /* Comfortable single-column reading */
      .markdown-section {
        max-width: 100% !important;
      }
    }

    /* Wide screens still feel like a book, not a wall of text */
    @media (min-width: 769px) {
      .markdown-section {
        padding-top: 2rem !important;
        padding-bottom: 4rem !important;
      }
    }

    /* Progress feel: soft top edge */
    .content::before {
      content: "";
      position: sticky;
      top: 0;
      display: block;
      height: env(safe-area-inset-top);
      background: var(--paper);
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="app">Opening the book…</div>
  <script>
    window.$docsify = {
      name: 'Neville Goddard',
      repo: 'ahmadpoorgholam/neville-goddard-wiki',
      loadSidebar: true,
      subMaxLevel: 2,
      search: {
        placeholder: 'Search books & lectures',
        noData: 'Nothing found',
        depth: 3,
      },
      auto2top: true,
      homepage: 'README.md',
      relativePath: true,
      maxLevel: 3,
      topMargin: 24,
      themeColor: '#8a6a1f',
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
